; Baseline for every environment (layered over php.ini-production).
; Development-only relaxations live in php-dev.ini, mounted by the dev target;
; `display_errors = On` used to apply to production too.
memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 8M
max_execution_time = 30
date.timezone = UTC

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
; php-fpm's stderr, which the container runtime collects; the previous
; /var/log/php_errors.log was not writable by www-data, so errors were lost.
error_log = /proc/self/fd/2
error_reporting = E_ALL

realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code does not change inside a built image; the dev overlay re-enables checks.
opcache.validate_timestamps = 0
opcache.preload_user = www-data

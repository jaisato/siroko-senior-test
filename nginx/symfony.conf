# Canonical Symfony recipe: only public/index.php is ever executed.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /var/www/app/public;

    client_max_body_size 8m;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        # The php container mounts the project at the same path, so the real
        # path of the document root resolves on both sides.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;

        # Prevents URIs that include the front controller from being served.
        internal;
    }

    # Any other PHP file is not served.
    location ~ \.php$ {
        return 404;
    }

    location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|woff2?)$ {
        expires 7d;
        access_log off;
    }
}

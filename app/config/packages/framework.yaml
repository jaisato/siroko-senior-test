# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # A stateless JSON API: no cookie, no session storage to configure or leak.
    session: false

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        profiler:
            collect: false
        http_method_override: false

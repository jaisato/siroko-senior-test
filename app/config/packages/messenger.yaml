framework:
    messenger:
        # A message that exhausts its retries is kept here instead of being
        # dropped, so it can be inspected and replayed (messenger:failed:*).
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: messages
                        type: direct
                        durable: true
                    queues:
                        messages:
                            binding_keys: [messages]
                            durable: true
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 30000

            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: failed
                        type: direct
                        durable: true
                    queues:
                        failed:
                            binding_keys: [failed]
                            durable: true

        routing:
            # Every domain event goes to the broker; DomainEventConsumer picks
            # them up from the worker (see the `worker` compose service).
            'Siroko\Cart\Domain\Event\DomainEvent': async

when@test:
    framework:
        messenger:
            transports:
                # No broker in the test environment: dispatched messages stay in
                # memory, where a test can assert on them.
                async: 'in-memory://'
                failed: 'in-memory://'

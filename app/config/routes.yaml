# No `host:` restriction: it was bound to API_DOMAIN (localhost), so the very
# same request answered 404 as soon as it arrived with any other Host header -
# behind a proxy, from another container, or from a colleague's machine.
api:
    resource: './routes/api/'
    type: directory
    prefix: '%api_route_prefix%'

# The one route outside the API Platform resources: GET /health has no read
# model and no version, and the container healthchecks probe it at a fixed
# path. Outside the API prefix it is also public when API_TOKENS is set.
health:
    resource: '../src/Cart/Infrastructure/Api/Controller/Health/'
    type: attribute

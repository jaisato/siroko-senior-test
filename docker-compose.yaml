# Development stack. Values come from a root `.env` (see .env.example); every
# variable has a safe development default so a plain `docker compose up -d`
# works on a fresh clone. The application connects with its own MySQL user.
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-dev_secret_not_for_production}
      XDEBUG_MODE: ${XDEBUG_MODE:-off}   # "debug" to attach an IDE
      DATABASE_URL: "mysql://${MYSQL_USER:-siroko}:${MYSQL_PASSWORD:-siroko_dev_password}@db:3306/${MYSQL_DATABASE:-siroko_cart}?serverVersion=8.0&charset=utf8mb4"
      MESSENGER_TRANSPORT_DSN: "doctrine://default"
      CART_RESERVATION_TTL: ${CART_RESERVATION_TTL:-1800}
    volumes:
      - ./:/var/www:cached
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Consumes the domain events routed to the `async` transport, which lives in
  # the MySQL database (table messenger_messages). Bounded lifetime + restart is
  # the supervision strategy: the process exits cleanly every hour or at 256M
  # and compose starts a fresh one.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: ["php", "app/bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M", "-vv"]
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-dev_secret_not_for_production}
      XDEBUG_MODE: "off"
      DATABASE_URL: "mysql://${MYSQL_USER:-siroko}:${MYSQL_PASSWORD:-siroko_dev_password}@db:3306/${MYSQL_DATABASE:-siroko_cart}?serverVersion=8.0&charset=utf8mb4"
      MESSENGER_TRANSPORT_DSN: "doctrine://default"
    volumes:
      - ./:/var/www:cached
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Releases the stock of pending carts whose reservation has lapsed, once a
  # minute. In production the same command goes in cron (see the README).
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: ["sh", "-c", "while true; do php app/bin/console cart:release-expired; sleep 60; done"]
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-dev_secret_not_for_production}
      XDEBUG_MODE: "off"
      DATABASE_URL: "mysql://${MYSQL_USER:-siroko}:${MYSQL_PASSWORD:-siroko_dev_password}@db:3306/${MYSQL_DATABASE:-siroko_cart}?serverVersion=8.0&charset=utf8mb4"
      MESSENGER_TRANSPORT_DSN: "doctrine://default"
      CART_RESERVATION_TTL: ${CART_RESERVATION_TTL:-1800}
    volumes:
      - ./:/var/www:cached
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - php
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      # Only the document root is exposed to the web server.
      - ./app/public:/var/www/app/public:ro
      - ./nginx/symfony.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-siroko_cart}
      MYSQL_USER: ${MYSQL_USER:-siroko}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-siroko_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    volumes:
      - db_data:/var/lib/mysql
      # Creates `${MYSQL_DATABASE}_test` and grants it to the application user.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_dev_password}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  db_data:
